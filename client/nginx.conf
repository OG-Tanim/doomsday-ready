server {
  listen 80;
  root /usr/share/nginx/html;

  # API calls go to the server container. "^~" wins over the SPA fallback,
  # and the exact match makes a bare /api reach the API (JSON 404) too.
  location = /api {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
  }
  location ^~ /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
  }

  # React Router: unknown paths fall back to index.html
  location / {
    try_files $uri /index.html;
  }
}
